extends: "../phase3_embedding_base.yaml"

# Phase 3 embedding experiment.
# Inherited baseline: C02.
# Tested embedding model: intfloat/multilingual-e5-base.
# Embedding is the only intended changed variable.

experiment:
  experiment_id: "E02"

embedding:
  provider: "sentence_transformers"
  model_name: "intfloat/multilingual-e5-base"
  normalize_embeddings: true
  query_prefix: "query: "
  document_prefix: "passage: "
  dense_output_only: true
  pooling: "sentence_transformers_default"
  max_seq_length: 512
  expected_dimension: 768
  batch_size: 128
  device: "cuda"
  require_cuda: true
  cache_dir: ".cache/sentence-transformers"

index:
  dense_dim: 768
  index_name: "sivas_phase3_c02_e5_base_faiss"
