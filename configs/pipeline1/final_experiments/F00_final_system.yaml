extends: "G03_gpt55.yaml"

# ============================================================
# F00 — Final Production System
# ============================================================
# The SIVAS RAG benchmark final system, assembled by selecting
# the winner of every benchmark series (C, E, V, A, R, G) and
# combining them into the simplest architecture that delivered
# the best experimental performance.
#
# F00 is NOT an experiment.
# F00 is the production outcome of the complete benchmark.
# It is compared end-to-end against the reference system B00.
# The contribution of each individual component was already
# validated during the C-, E-, V-, A-, R-, and G-series
# experiments. The F00 vs B00 comparison measures the net
# end-to-end gain of replacing all B00 components with their
# benchmark-selected counterparts.
#
# ============================================================
# INHERITANCE CHAIN (innermost → outermost)
# ============================================================
#
#   F00_final_system.yaml
#     → G03_gpt55.yaml
#         → R00_global_retrieval.yaml
#             → A_final.yaml
#                 → A04-K10_top10.yaml
#                     → A03_reranker.yaml
#                         → A02_elasticsearch_hybrid_rrf.yaml
#                             → A00_elasticsearch_dense.yaml
#                                 → E03_mistral_api_embedding.yaml
#                                     → ../phase3_embedding_base.yaml
#                                         → C02_sentence1024.yaml
#                                             → C00_sentence512_baseline.yaml
#                                                 → E00-G_global_dense_baseline.yaml
#
# ============================================================
# BENCHMARK WINNERS — ONE WINNER PER SERIES
# ============================================================
#
#   Series  Winner  Component               Selected Value
#   ------  ------  ---------               ---------------
#   C       C02     Chunking                Sentence, 1024 tokens, 400 overlap
#   E       E03     Embedding               Mistral Embed API (mistral-embed, 1024 dim)
#   V       V02     Vector Database         Elasticsearch (cosine script_score)
#   A       A02     Retrieval Algorithm     Hybrid RRF (Dense + BM25, rrf_k=60)
#   A       A03     Reranker                BGE-Reranker-v2-m3 (CUDA, rerank_top_k=20)
#   A(k)    K05     Retrieval Depth         fetch_k=20, top_k=5
#   R       R00     Retrieval Strategy      Global (no category routing)
#   G       G03     Generator               GPT-5.5 (OpenAI API, temperature=0.0)
#
# ============================================================
# DISABLED COMPONENTS — EXPERIMENTALLY OUTPERFORMED
# ============================================================
#
#   Component                    Reason disabled
#   ---------                    ---------------
#   Adaptive retrieval (R01)     R00 (global) outperformed R01 in the R-series
#   Orchestration LLM            Required only by R01 routing; unnecessary for R00
#   Category prediction          Required only by adaptive routing; not needed
#   Routing validation probes    Required only by category routing; not needed
#   Routing thresholds           Required only by routing validation; not needed
#   Fallback logic               Only meaningful when routing is active; not needed
#   LLM-based global fallback    Subsumed by unconditional global retrieval
#
# ============================================================
# COMPONENT DESCRIPTIONS
# ============================================================
#
# C02 — Sentence Chunking (1024 tokens / 400 overlap)
#   Selected in the C-series as the optimal chunking strategy.
#   Sentence boundaries preserve semantic coherence. The 1024-token
#   window captures sufficient context for domain-specific ERP queries,
#   and the 400-token overlap reduces boundary-clipping artefacts.
#
# E03 — Mistral Embed API (mistral-embed)
#   Selected in the E-series as the best embedding model.
#   Produces 1024-dimensional cosine-normalised vectors via the
#   Mistral API. Shared with B00 (same embedding model), ensuring
#   the F00 vs B00 comparison isolates architectural differences
#   rather than embedding model differences.
#
# V02 — Elasticsearch
#   Selected in the V-series as the best vector backend.
#   Hosts both the dense cosine script_score index and the BM25
#   inverted index, enabling in-engine hybrid retrieval without
#   inter-system latency.
#
# A02 — Hybrid Retrieval (Dense + BM25 via RRF)
#   Selected in the A-series as the best retrieval algorithm.
#   Combines dense cosine similarity with BM25 term matching.
#   Reciprocal Rank Fusion (rrf_k=60) merges the two ranked lists,
#   providing robustness to both semantic and lexical query types.
#
# A03 — BGE-Reranker-v2-m3
#   Selected in the A-series as the best reranker.
#   Multilingual cross-encoder; supports German ERP domain text.
#   Applied to all fetch_k=20 candidates before top_k selection.
#   Runs on CUDA for production-speed inference.
#
# K05 — Retrieval Depth (fetch_k=20, top_k=5)
#   Selected in the A-series (K-ablation) as the optimal depth.
#   fetch_k=20 passes 20 candidates to the reranker; top_k=5 are
#   forwarded to the generator. Depth is intentionally identical
#   to B00 to measure architecture gains, not depth effects.
#
# R00 — Global Retrieval
#   Selected in the R-series as the winning strategy.
#   Global retrieval unconditionally searches the complete
#   Elasticsearch knowledge base. No category routing, no
#   orchestration LLM, no validation probes, no fallback logic.
#
# G03 — GPT-5.5
#   Selected in the G-series as the best generator.
#   OpenAI API, temperature=0.0. Temperature is omitted from the
#   API payload for gpt-5.5 (handled by _NO_CUSTOM_TEMPERATURE_PREFIXES
#   in OpenAIGenerator._build_payload); 0.0 is recorded here for
#   manifest accuracy only.
#
# ============================================================
# COMPLETE RETRIEVAL FLOW
# ============================================================
#
#   User query (German ERP question)
#   │
#   ├─→ Mistral Embed API (mistral-embed)
#   │      → 1024-dim normalised vector
#   │
#   ├─→ Elasticsearch Dense Index
#   │      (sivas_phase4_a00_elasticsearch_dense_mistral_embed)
#   │      → script_score cosine similarity → ranked list A
#   │
#   ├─→ Elasticsearch BM25 Index
#   │      (sivas_phase4_a01_bm25_c02_chunks)
#   │      → BM25 term scoring → ranked list B
#   │
#   ├─→ Hybrid RRF Fusion (rrf_k=60)
#   │      → merged ranked list → fetch_k=20 candidates
#   │
#   ├─→ BGE-Reranker-v2-m3 (CUDA, rerank_top_k=20)
#   │      → cross-encoder re-scores all 20 candidates
#   │
#   └─→ Top-5 passages retained (top_k=5)
#
# ============================================================
# COMPLETE GENERATION FLOW
# ============================================================
#
#   Top-5 reranked passages
#   │
#   ├─→ ranked_budget context truncation
#   │      max_context_tokens = 6000
#   │      max_chunk_tokens   = 1800
#   │      max_context_chars  = 24000
#   │      max_chunk_chars    = 8000
#   │
#   ├─→ answer_generation_sivas_v1.txt prompt
#   │      (German ERP domain; instructs UNKNOWN if unanswerable)
#   │
#   └─→ GPT-5.5 (OpenAI API, temperature=0.0)
#          → Final answer in German
#
# ============================================================
# FINAL ARCHITECTURE DIAGRAM
# ============================================================
#
#   ┌──────────────────────────────────────────────┐
#   │          Knowledge Base (JSONL)              │
#   └──────────────────┬───────────────────────────┘
#                      │
#          ┌───────────▼────────────┐
#          │   C02 Sentence Chunking │
#          │   1024 tokens / 400 ov  │
#          └───────────┬────────────┘
#                      │
#          ┌───────────▼────────────┐
#          │    E03 Mistral Embed   │
#          │    API  (1024 dim)     │
#          └──────┬─────────┬───────┘
#                 │         │
#       ┌─────────▼──┐  ┌───▼────────┐
#       │  V02 Dense  │  │  V02 BM25  │
#       │  ES Index   │  │  ES Index  │
#       └─────────┬──┘  └───┬────────┘
#                 │         │
#          ┌──────▼─────────▼──────┐
#          │    A02 Hybrid RRF      │
#          │   (rrf_k=60)           │
#          └──────────┬─────────────┘
#                     │  fetch_k = 20 candidates
#          ┌──────────▼─────────────┐
#          │   A03 BGE-Reranker     │
#          │   v2-m3  (CUDA)        │
#          └──────────┬─────────────┘
#                     │  top_k = 5 passages
#          ┌──────────▼─────────────┐
#          │    G03 GPT-5.5         │
#          │    temperature = 0.0   │
#          └──────────┬─────────────┘
#                     │
#          ┌──────────▼─────────────┐
#          │      Final Answer      │
#          └────────────────────────┘
#
# ============================================================
# COMPONENT COMPARISON: F00 vs B00
# ============================================================
#
#   Dimension           B00 (Reference)              F00 (Final)
#   ---------           ---------------              -----------
#   Chunking            SIVAS char 2048 / 0 ov       Sentence 1024 / 400 ov
#   Embedding           Mistral Embed API             Mistral Embed API
#   Vector Backend      pgvector (HNSW, cosine)       Elasticsearch (cosine)
#   Retrieval alg.      Dense only (pgvector)         Hybrid RRF (Dense + BM25)
#   Reranker            None                          BGE-Reranker-v2-m3
#   Routing             Adaptive (category-aware)     Global (unconditional)
#   Orchestration       Mistral-small (local Ollama)  Disabled
#   Generator           Mistral-small (local Ollama)  GPT-5.5 (OpenAI API)
#   top_k / fetch_k     5 / 20                        5 / 20
#
# ============================================================
# AUTHENTICATION (must be set before running)
# ============================================================
#   MISTRAL_API_KEY  — required by EmbeddingStage (mistral-embed)
#   OPENAI_API_KEY   — required by OpenAIGenerator (gpt-5.5)
#                      pipeline preflight check fails if absent
#
# ============================================================
# ELASTICSEARCH INDEXES (reused from A-series; no re-indexing)
# ============================================================
#   Dense : sivas_phase4_a00_elasticsearch_dense_mistral_embed
#   BM25  : sivas_phase4_a01_bm25_c02_chunks
#
# ============================================================
# RUNTIME NOTES
# ============================================================
#   resume=true (inherited via E00-G): a second run skips all
#   already-completed questions without additional GPT-5.5 API
#   calls. Checkpointing writes one row per question to results.jsonl.
#
#   Monetary cost estimation is disabled (estimate_cost=false)
#   because GPT-5.5 pricing has not been officially published.
#   Token counts (input_tokens, output_tokens, total_tokens) are
#   recorded normally in every output row and the run manifest.
#   Update pricing.* and re-enable estimate_cost once rates are
#   confirmed.
# ============================================================

experiment:
  experiment_id: "F00"

# All retrieval, reranking, chunking, embedding, and generation
# settings are inherited from the chain above. No component is
# overridden here. F00 is structurally identical to G03 in every
# respect except experiment_id, which designates it as the final
# production system rather than a G-series generation experiment.

telemetry:
  estimate_cost: false
  pricing:
    input_per_1k_tokens_usd: 0.0
    output_per_1k_tokens_usd: 0.0
