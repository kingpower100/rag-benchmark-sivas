extends: "../base_eval.yaml"

evaluation:
  eval_run_id: "B04"
  strict_failure_threshold: true
  max_generation_failure_rate: 0.0

inputs:
  pipeline1_results_path: "data/runs/pipeline1/B04/results.jsonl"
  rag_outputs:
    - "data/runs/pipeline1/B04/results.jsonl"

source_validation:
  expected_experiment_id: "B04"
  expected_retriever_type: "dense"
  expected_orchestration_enabled: false
  expected_generator_provider: "ollama"
  expected_generator_model: "mistral-small"
  expected_top_k: 5
  expected_fetch_k: 20
  expected_reranker_enabled: false
  expected_fallback_to_global: false
  require_hybrid_diagnostics: false
  require_reranker_diagnostics: false
  require_routing_diagnostics: false
  require_routing_reconciliation: false

retrieval_evaluation:
  document_level:
    enabled: true
  chunk_level:
    enabled: true
    ground_truth_path: "data/ground_truth/chunk_level/B00_sivas_character2048_overlap0/gold_chunk_annotations_B00_sivas_character2048_overlap0.jsonl"
    missing_question_policy: error
