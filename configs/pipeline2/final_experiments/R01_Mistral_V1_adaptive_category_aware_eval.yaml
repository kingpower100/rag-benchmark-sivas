extends: "../base_eval.yaml"

evaluation:
  eval_run_id: "R01-M-V1_adaptive_category_aware_eval"
  strict_failure_threshold: true
  max_generation_failure_rate: 0.0

inputs:
  pipeline1_results_path: "data/runs/pipeline1/R01-M-V1/results.jsonl"
  rag_outputs:
    - "data/runs/pipeline1/R01-M-V1/results.jsonl"

source_validation:
  expected_experiment_id: "R01-M-V1"
  expected_retriever_type: "adaptive_category_aware_hybrid_rrf"
  expected_orchestration_enabled: true
  expected_generator_provider: "ollama"
  expected_generator_model: "qwen2.5:7b-instruct"
  expected_top_k: 5
  expected_fetch_k: 20
  expected_reranker_enabled: true
  expected_fallback_to_global: true
  require_hybrid_diagnostics: true
  require_reranker_diagnostics: true
  require_routing_diagnostics: true
  require_routing_reconciliation: true

retrieval:
  k: 5
  ks: [1, 3, 5]

retrieval_evaluation:
  document_level:
    enabled: true
  chunk_level:
    enabled: true
    ground_truth_path: "data/ground_truth/chunk_level/C02_sentence1024_overlap400/gold_chunk_annotations_C02_sentence1024_overlap400.jsonl"
    missing_question_policy: error
